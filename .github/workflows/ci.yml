name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_fork_tests:
        description: "Also run the Base Sepolia fork tests (a local Anvil fork of the public Base Sepolia RPC; nothing is sent to Base Sepolia)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Static web page is up to date
        run: pnpm check:web
      - name: CLI smoke test
        run: |
          node dist/cli.js --version
          node dist/cli.js help > /dev/null

  shutdown-drill:
    name: Shutdown drill (Anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4
      - run: pnpm install --frozen-lockfile
      # The drill deploys the Agent Bank contracts from the artifacts vendored in
      # test/fixtures/agentbank-contracts (scripts/vendor-contracts.sh; SOURCE records the contracts
      # commit), so CI needs no access to the contracts repository. REQUIRE_AGENTBANK_CONTRACTS=1
      # makes a missing artifact fail the job: the drill never silently skips a part.
      - name: Shutdown drill
        env:
          REQUIRE_AGENTBANK_CONTRACTS: "1"
          DRILL_TRANSCRIPT_DIR: ${{ runner.temp }}/shutdown-drill
        run: pnpm test:integration
      - name: Keep the drill summary and CLI transcripts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shutdown-drill
          path: ${{ runner.temp }}/shutdown-drill
          if-no-files-found: ignore

  # Runs against the public Base Sepolia RPC (or BASE_SEPOLIA_RPC_URL, if that secret is set) through a
  # local Anvil fork: nothing is sent to Base Sepolia, only Anvil development keys sign, and the suite
  # skips with a warning on the job summary when the RPC is unreachable or cannot serve the fork block.
  base-sepolia-fork:
    name: Base Sepolia fork (real Safe7579, recovery module, OwnableValidator, USDC)
    if: github.event_name == 'workflow_dispatch' && inputs.run_fork_tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4
      - run: pnpm install --frozen-lockfile
      - name: Fork tests (local Anvil fork; nothing is sent to Base Sepolia)
        env:
          RUN_FORK_TESTS: "1"
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
        run: pnpm test:integration test/integration/base-sepolia-fork.test.ts
